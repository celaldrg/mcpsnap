name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Replay the example cassette
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null || PY=python
          cargo run --quiet -- replay examples/notes.cassette.jsonl -- $PY examples/notes_server.py
          if cargo run --quiet -- replay examples/notes.cassette.jsonl -- $PY examples/notes_server.py --v2; then
            echo "expected drift to fail"; exit 1
          fi
